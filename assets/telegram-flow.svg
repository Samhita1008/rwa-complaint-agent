<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Illustrative Telegram conversation flow">
  <defs>
    <style>
      .f{font-family:Segoe UI,Helvetica,Arial,sans-serif}
      .h{font-size:15px;font-weight:600;fill:#F5DABF}
      .m{font-size:14px;fill:#F5DABF}
      .d{font-size:12px;fill:#d4b49b}
      .tag{font-size:12px;fill:#F5DABF;letter-spacing:2px}
    </style>
  </defs>
  <rect width="1200" height="560" rx="16" fill="#6C151E"/>
  <text x="40" y="44" class="f tag">ILLUSTRATIVE FLOW · MESSAGES SHORTENED · NOT A LIVE SCREENSHOT</text>

  <!-- phone 1 resident -->
  <g transform="translate(40,70)">
    <rect width="340" height="450" rx="22" fill="#4d0f16" stroke="#c98a7a" stroke-width="1.5"/>
    <rect width="340" height="52" rx="22" fill="#4d0f16"/>
    <rect y="30" width="340" height="22" fill="#4d0f16"/>
    <text x="20" y="32" class="f h">Society Helpdesk Bot</text>
    <text x="20" y="48" class="f d">Resident view</text>

    <rect x="60" y="76" width="260" height="62" rx="14" fill="#9a4650"/>
    <text x="76" y="102" class="f m">Block B lift has stopped working,</text>
    <text x="76" y="122" class="f m">people stuck on 4th floor!</text>

    <rect x="20" y="162" width="270" height="130" rx="14" fill="#4d0f16"/>
    <text x="36" y="188" class="f m">Ticket logged</text>
    <text x="36" y="212" class="f d">Category: Common-area</text>
    <text x="36" y="232" class="f d">Urgency: High</text>
    <text x="36" y="252" class="f d">Status: Open</text>
    <text x="36" y="274" class="f m">We'll keep you posted.</text>

    <rect x="20" y="330" width="290" height="90" rx="14" fill="#4d0f16" stroke="#F5DABF" stroke-opacity="0.6"/>
    <text x="36" y="358" class="f m">Update: your complaint has been</text>
    <text x="36" y="378" class="f m">marked resolved. Thanks for</text>
    <text x="36" y="398" class="f m">your patience.</text>
  </g>

  <!-- phone 2 secretary -->
  <g transform="translate(430,70)">
    <rect width="340" height="450" rx="22" fill="#4d0f16" stroke="#c98a7a" stroke-width="1.5"/>
    <rect width="340" height="52" rx="22" fill="#4d0f16"/>
    <rect y="30" width="340" height="22" fill="#4d0f16"/>
    <text x="20" y="32" class="f h">Society Helpdesk Bot</text>
    <text x="20" y="48" class="f d">Secretary view</text>

    <rect x="20" y="76" width="300" height="168" rx="14" fill="#4d0f16"/>
    <text x="36" y="102" class="f m">Approve vendor message?</text>
    <text x="36" y="128" class="f d">"Hello, lift fault reported in</text>
    <text x="36" y="148" class="f d">Block B, people stranded. Please</text>
    <text x="36" y="168" class="f d">send a technician urgently."</text>
    <rect x="36" y="188" width="120" height="34" rx="8" fill="#F5DABF"/>
    <text x="96" y="210" text-anchor="middle" class="f" font-size="14" font-weight="700" fill="#6C151E">Approve</text>
    <rect x="168" y="188" width="120" height="34" rx="8" fill="none" stroke="#c98a7a"/>
    <text x="228" y="210" text-anchor="middle" class="f m">Edit</text>

    <rect x="20" y="262" width="260" height="70" rx="14" fill="#4d0f16"/>
    <text x="36" y="288" class="f m">Open WhatsApp with vendor</text>
    <text x="36" y="312" class="f" font-size="13" fill="#F5DABF">wa.me link ready</text>

    <rect x="90" y="360" width="230" height="40" rx="14" fill="#9a4650"/>
    <text x="106" y="385" class="f m">/resolve T-0042</text>
  </g>

  <!-- phone 3 sheet -->
  <g transform="translate(820,70)">
    <rect width="340" height="450" rx="22" fill="#4d0f16" stroke="#c98a7a" stroke-width="1.5"/>
    <rect width="340" height="52" rx="22" fill="#4d0f16"/>
    <rect y="30" width="340" height="22" fill="#4d0f16"/>
    <text x="20" y="32" class="f h">Google Sheet · Complaints</text>
    <text x="20" y="48" class="f d">The system of record</text>

    <g class="f d">
      <text x="20" y="84">ticket</text><text x="90" y="84">flat</text><text x="140" y="84">category</text><text x="235" y="84">urgency</text><text x="290" y="84">status</text>
    </g>
    <line x1="20" y1="94" x2="320" y2="94" stroke="#c98a7a"/>
    <g class="f m" font-size="13">
      <text x="20" y="120">T-0042</text><text x="90" y="120">B-402</text><text x="140" y="120">Common-area</text><text x="235" y="120">High</text><text x="290" y="120" fill="#F5DABF">Resolved</text>
      <text x="20" y="150">T-0041</text><text x="90" y="150">A-101</text><text x="140" y="150">Plumbing</text><text x="235" y="150">Medium</text><text x="290" y="150">Open</text>
      <text x="20" y="180">T-0040</text><text x="90" y="180">C-206</text><text x="140" y="180">Plumbing</text><text x="235" y="180">Low</text><text x="290" y="180">Open</text>
    </g>
    <text x="20" y="420" class="f d">Sample rows for illustration.</text>
  </g>
</svg>
