<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="System architecture">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#5CF2B0"/>
    </marker>
    <style>
      .t{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#F2F7F4}
      .s{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#8FA89C;font-size:13px}
      .box{fill:#0d1713;stroke:#2a4a3b;stroke-width:1.5}
      .hot{fill:#0f2219;stroke:#5CF2B0;stroke-width:1.5}
      .ln{stroke:#5CF2B0;stroke-width:2;fill:none;marker-end:url(#a)}
      .tag{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:12px;fill:#5CF2B0;letter-spacing:2px}
    </style>
  </defs>
  <rect width="1200" height="520" rx="16" fill="#070b09"/>

  <!-- lanes -->
  <text x="40" y="52" class="tag">1 · COMPLAINT INTAKE</text>
  <text x="40" y="232" class="tag">2 · VENDOR DISPATCH</text>
  <text x="40" y="412" class="tag">3 · STATUS TRACKING</text>

  <!-- lane 1 -->
  <rect x="40" y="70" width="170" height="80" rx="10" class="box"/>
  <text x="125" y="104" text-anchor="middle" class="t" font-size="16" font-weight="600">Resident</text>
  <text x="125" y="126" text-anchor="middle" class="s">messages the bot</text>

  <rect x="270" y="70" width="170" height="80" rx="10" class="box"/>
  <text x="355" y="104" text-anchor="middle" class="t" font-size="16" font-weight="600">Telegram Bot</text>
  <text x="355" y="126" text-anchor="middle" class="s">n8n trigger</text>

  <rect x="500" y="70" width="190" height="80" rx="10" class="hot"/>
  <text x="595" y="104" text-anchor="middle" class="t" font-size="16" font-weight="600">Groq LLM</text>
  <text x="595" y="126" text-anchor="middle" class="s">category + urgency</text>

  <rect x="750" y="70" width="190" height="80" rx="10" class="box"/>
  <text x="845" y="104" text-anchor="middle" class="t" font-size="16" font-weight="600">Google Sheets</text>
  <text x="845" y="126" text-anchor="middle" class="s">ticket ID, flat, status</text>

  <rect x="1000" y="70" width="160" height="80" rx="10" class="box"/>
  <text x="1080" y="104" text-anchor="middle" class="t" font-size="16" font-weight="600">Confirmation</text>
  <text x="1080" y="126" text-anchor="middle" class="s">ticket sent back</text>

  <path d="M210 110H268" class="ln"/><path d="M440 110H498" class="ln"/>
  <path d="M690 110H748" class="ln"/><path d="M940 110H998" class="ln"/>

  <!-- lane 2 -->
  <rect x="40" y="250" width="190" height="80" rx="10" class="box"/>
  <text x="135" y="284" text-anchor="middle" class="t" font-size="16" font-weight="600">New ticket row</text>
  <text x="135" y="306" text-anchor="middle" class="s">Sheets trigger</text>

  <rect x="290" y="250" width="190" height="80" rx="10" class="hot"/>
  <text x="385" y="284" text-anchor="middle" class="t" font-size="16" font-weight="600">Groq drafts message</text>
  <text x="385" y="306" text-anchor="middle" class="s">per-category vendor list</text>

  <rect x="540" y="250" width="210" height="80" rx="10" class="box"/>
  <text x="645" y="284" text-anchor="middle" class="t" font-size="16" font-weight="600">Secretary approves</text>
  <text x="645" y="306" text-anchor="middle" class="s">human-in-the-loop, Telegram</text>

  <rect x="810" y="250" width="200" height="80" rx="10" class="box"/>
  <text x="910" y="284" text-anchor="middle" class="t" font-size="16" font-weight="600">wa.me link</text>
  <text x="910" y="306" text-anchor="middle" class="s">one tap to WhatsApp the vendor</text>

  <path d="M230 290H288" class="ln"/><path d="M480 290H538" class="ln"/><path d="M750 290H808" class="ln"/>

  <!-- lane 3 -->
  <rect x="40" y="430" width="210" height="70" rx="10" class="box"/>
  <text x="145" y="460" text-anchor="middle" class="t" font-size="16" font-weight="600">/resolve &lt;ticket_id&gt;</text>
  <text x="145" y="482" text-anchor="middle" class="s">sent by secretary</text>

  <rect x="320" y="430" width="210" height="70" rx="10" class="box"/>
  <text x="425" y="460" text-anchor="middle" class="t" font-size="16" font-weight="600">Sheets updated</text>
  <text x="425" y="482" text-anchor="middle" class="s">status → resolved</text>

  <rect x="600" y="430" width="230" height="70" rx="10" class="hot"/>
  <text x="715" y="460" text-anchor="middle" class="t" font-size="16" font-weight="600">Resident notified</text>
  <text x="715" y="482" text-anchor="middle" class="s">automatic resolution update</text>

  <path d="M250 465H318" class="ln"/><path d="M530 465H598" class="ln"/>

  <!-- coming soon -->
  <rect x="880" y="410" width="280" height="90" rx="10" class="hot"/>
  <text x="1020" y="438" text-anchor="middle" class="tag">4 · NOTICE BROADCAST</text>
  <text x="1020" y="462" text-anchor="middle" class="t" font-size="14" font-weight="600">/notice → approve → send to all</text>
  <text x="1020" y="484" text-anchor="middle" class="s">/ack replies logged per resident</text>
</svg>
